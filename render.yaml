services:
  - type: web
    name: legal-trend-radar-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LAW_API_OC
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_BASE_URL
        sync: false
      - key: DEFAULT_START_DATE
        value: "2016-01-01"
      - key: DEFAULT_END_DATE
        value: "2026-12-31"
      - key: FORECAST_HORIZON
        value: "6"
      - key: NEXT_PUBLIC_API_URL
        sync: false
